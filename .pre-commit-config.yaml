repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        files: ^asciidoctest/
        additional_dependencies:
          - asciidoctrine>=0.2.0a8
          - asciidocstring>=0.1.0a11
          - lark>=1.3.1
          - pytest>=7.0
        args: [--strict]
