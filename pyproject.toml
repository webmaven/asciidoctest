[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asciidoctest"
version = "0.2.0a5"
description = "Verifiable, stateful, and interactive documentation with AsciiDoc."
readme = {file = "README.adoc", content-type = "text/plain"}
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Michael Bernstein", email = "zopemaven@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Framework :: Pytest",
]
dependencies = [
    "asciidoctrine>=0.2.0a8",
    "asciidocstring>=0.1.0a11",
    "lark>=1.3.1",
]

[project.urls]
Homepage = "https://github.com/webmaven/asciidoctest"
Repository = "https://github.com/webmaven/asciidoctest"
Documentation = "https://webmaven.github.io/asciidoctest/"
Changelog = "https://github.com/webmaven/asciidoctest/blob/main/CHANGELOG.adoc"
"Bug Tracker" = "https://github.com/webmaven/asciidoctest/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "golem-docs>=0.1.0a1; python_version >= '3.14'",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-asciidoctrine>=0.1.0a1; python_version >= '3.14'",
    "sphinx-rtd-theme>=2.0.0",
]

[project.entry-points.pytest11]
asciidoctest = "asciidoctest.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["asciidoctest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests",
    "README.adoc",
]

[tool.coverage.run]
source = ["asciidoctest"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 97

[tool.mypy]
strict = true
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.envs.default.scripts]
test = "coverage run -m pytest {args}"
cov-report = "coverage report -m"
lint = "ruff check {args:.}"
format = "ruff format --check {args:.}"
format-fix = "ruff format {args:.}"
typecheck = "mypy asciidoctest {args}"
docs-build = "sphinx-build -b html docs/ docs/_build/html"
docs-serve = "python -m http.server --directory docs/_build/html"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["S102", "E501"]


