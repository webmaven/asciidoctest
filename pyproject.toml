[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asciidoctest"
version = "0.2.0a4"
description = "Verifiable, stateful, and interactive documentation with AsciiDoc."
readme = {file = "README.adoc", content-type = "text/plain"}
requires-python = ">=3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "Michael Bernstein", email = "zopemaven@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Framework :: Pytest",
]
dependencies = [
    "asciidoctrine>=0.2.0a5",
    "asciidocstring>=0.1.0a8",
    "lark>=1.3.1",
]

[project.urls]
Homepage = "https://github.com/webmaven/asciidoctest"
Repository = "https://github.com/webmaven/asciidoctest"
Documentation = "https://webmaven.github.io/asciidoctest/"
Changelog = "https://github.com/webmaven/asciidoctest/blob/main/CHANGELOG.adoc"
"Bug Tracker" = "https://github.com/webmaven/asciidoctest/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-asciidoctrine>=0.1.0a1",
    "sphinx-rtd-theme>=2.0.0",
]

[project.entry-points.pytest11]
asciidoctest = "asciidoctest.pytest_plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["asciidoctest*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests",
    "README.adoc",
]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["S102", "E501"]


